services:
  - type: web
    runtime: node
    name: climateshield-api
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  - type: web
    runtime: static
    name: climateshield-web
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: climateshield-api
          envVarKey: RENDER_EXTERNAL_URL
